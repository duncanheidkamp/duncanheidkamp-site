<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ghoti Translate — Duncan Heidkamp</title>
<meta name="description" content="Respell any English word using English's own worst habits, the way ghoti spells fish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: Google-Translate shell — tab row, language bar, two facing panes; spelling-dictionary details */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eaeef5; --line:#d4dbe7;
  --ink:#16213a; --muted:#5b6680; --accent:#2747b8; --accent-soft:#e3e9fb;
  --hl:#ffe76a; --hl-ink:#16213a;
  --seg1:#e3e9fb; --seg2:#fff3b8;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#171e30; --surface-2:#1f2840; --line:#2c3652;
  --ink:#e6eaf5; --muted:#9aa5c2; --accent:#8fa7ff; --accent-soft:#25305a;
  --hl:#c9a92e; --hl-ink:#10131c; --seg1:#25305a; --seg2:#3d3518; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#171e30; --surface-2:#1f2840; --line:#2c3652;
  --ink:#e6eaf5; --muted:#9aa5c2; --accent:#8fa7ff; --accent-soft:#25305a;
  --hl:#c9a92e; --hl-ink:#10131c; --seg1:#25305a; --seg2:#3d3518; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.logo{font-family:var(--display);font-size:1.6rem;letter-spacing:-.01em}
.logo b{font-weight:400;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 2px}
.logo span{color:var(--muted)}
.logo a{color:inherit;text-decoration:none}
.logo a:hover b{background:linear-gradient(transparent 40%,var(--hl) 40%)}
.logo a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.tagline{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--accent);padding:7px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.langbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}
.lang{padding:12px 20px;font-weight:700;color:var(--accent);font-size:.95rem;border-bottom:2px solid var(--accent);justify-self:start;margin-left:4px}
.lang.right{justify-self:start}
.swap{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;margin:0 8px}
.swap:hover{background:var(--surface-2)}
.panes{display:grid;grid-template-columns:1fr 1fr}
.pane{min-width:0;padding:16px 20px 12px;display:flex;flex-direction:column;min-height:230px}
.pane.out{background:var(--surface-2);border-left:1px solid var(--line)}
.inrow{display:flex;gap:8px;align-items:flex-start}
textarea{flex:1;min-width:0;border:none;resize:none;background:transparent;color:var(--ink);font-family:var(--body);font-size:1.6rem;line-height:1.35;min-height:150px;outline:none}
textarea::placeholder{color:var(--muted)}
.iconbtn{width:40px;height:40px;flex:none;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.pane.out .iconbtn:hover{background:var(--surface)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;color:var(--muted);font-size:.8rem;font-family:var(--mono)}
.tools{display:flex;gap:2px;align-items:center}
.output{font-family:var(--display);font-size:1.75rem;line-height:1.6;word-break:break-word;min-height:150px}
.word{display:inline-block;margin-right:.35em}
.seg{font:inherit;color:inherit;border:none;padding:0 .04em;border-radius:4px;cursor:pointer;background:transparent;transition:background .15s}
.word .seg:nth-child(odd){background:var(--seg1)}
.word .seg:nth-child(even){background:var(--seg2)}
.seg:hover{outline:1px solid var(--accent)}
.seg.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:translateY(-3px);opacity:.3}100%{transform:none;opacity:1}}
.unknown{color:var(--muted);font-style:italic}
.punct{color:var(--muted)}
.hint{font-family:var(--body);font-size:.82rem;color:var(--muted);margin-top:4px}
.toggle{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:.85rem;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 4px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.shuffle{font:inherit;font-family:var(--body);font-weight:700;font-size:.88rem;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.shuffle:hover{background:var(--accent-soft)}
.below{margin-top:22px}
.below h2,.lib h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px;max-width:65ch}
.recipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.step .sp{font-family:var(--display);font-size:1.5rem;min-width:2.4ch}
.step .from{font-size:.9rem;min-width:0}
.step .ph{font-family:var(--mono);font-size:.75rem;color:var(--muted);letter-spacing:.04em}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;font-weight:700}
.wordlabel{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
.wordlabel:first-child{margin-top:0}
.lib .group{margin-top:22px}
.lib h3{font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.sounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sound{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.sound .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.sound .ipa{font-family:var(--display);font-size:1.35rem}
.sound .as{font-size:.85rem;color:var(--muted)}
.sound .arpa{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.sound ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sound li{font-size:.85rem;background:var(--surface-2);border-radius:6px;padding:2px 8px}
.sound li b{font-family:var(--display);font-weight:400;font-size:1rem;margin-right:4px}
.sound li.plain{opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:720px){
  .panes{grid-template-columns:1fr}
  .pane.out{border-left:none;border-top:1px solid var(--line)}
  .lang{padding:10px 12px}
  textarea{font-size:1.35rem;min-height:110px}
  .output{font-size:1.5rem;min-height:110px}
  .pane{min-height:0}
}
@media (prefers-reduced-motion:reduce){.seg.pop{animation:none}}
</style>
</head>

<div class="wrap">
  <header>

    <div class="tagline">Respell any English word using English's own worst habits.</div>

  <section id="view-text" role="tabpanel">

        <div class="lang right">Ghoti</div>

      <div class="panes">

        <div class="pane out">
          <div class="output" id="out" aria-live="polite"></div>
          <div class="hint">Tap any piece to re-roll just that sound.</div>
          <div class="foot">
            <button class="shuffle" id="shuffle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button>
            <div class="tools">
              <button class="iconbtn" id="copy" aria-label="Copy translation">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="below">
      <h2>How it's spelled</h2>
      <p class="sub">Every piece is borrowed from a real English word that spells the sound that way.</p>
      <div id="recipe"></div>
    </div>
  </section>

</div>

 AX:["ə","about","Vowels",[["a","[a]bout"],["e","tak[e]n"],["i","penc[i]l"],["o","lem[o]n"],["u","s[u]pply"],["ou","fam[ou]s"],["io","nat[io]n"],["ai","mount[ai]n"],["ea","oc[ea]n"],["eo","pig[eo]n"],["oi","porp[oi]se"],["y","s[y]ringe"]]],

};
// fish → ghoti, the classic, for the first render
const CLASSIC = {fish:["enou[gh]","w[o]men","na[ti]on"]};

const dict = new Map();
for (const e of DICT_RAW.split("|")) { const i=e.indexOf(" "); dict.set(e.slice(0,i), e.slice(i+1)); }
const decode = s => [...s].map(c=>{const n=c.charCodeAt(0); return ORDER[n>=97? n-97+26 : n-65];});

const $ = id => document.getElementById(id);
const src=$("src"), out=$("out"), recipe=$("recipe");
let model=[]; // [{type:'word', text, segs:[{ph, sp, ex}]}, {type:'punct', text}, {type:'unknown', text}]

function pick(ph, avoid){
  const all = LIB[ph][3];
  let pool = $("plain").checked || all.length<2 ? all : all.slice(1);
  if (avoid && pool.length>1) pool = pool.filter(s=>s[0]!==avoid);
  const s = pool[Math.floor(Math.random()*pool.length)];
  return {ph, sp:s[0], ex:s[1]};
}
function lookup(w){
  let k=w.toLowerCase().replace(/[’]/g,"'");
  if (dict.has(k)) return decode(dict.get(k));
  if (k.endsWith("'s") && dict.has(k.slice(0,-2))) return decode(dict.get(k.slice(0,-2))).concat("Z");
  return null;
}
function build(first){
  model=[];
  const parts = src.value.match(/[A-Za-z'’]+|[^A-Za-z'’]+/g) || [];
  for (const p of parts){
    if (!/[A-Za-z]/.test(p)) { model.push({type:"punct",text:p}); continue; }
    const k=p.toLowerCase();
    if (first && CLASSIC[k]) {
      const phs=decode(dict.get(k));
      model.push({type:"word",text:p,segs:phs.map((ph,i)=>{const ex=CLASSIC[k][i];return {ph,sp:ex.match(/\[(.+?)\]/)[1],ex};})});
      continue;
    }
    const phs = lookup(p);
    if (!phs) { model.push({type:"unknown",text:p}); continue; }
    model.push({type:"word",text:p,segs:phs.map(ph=>pick(ph))});
  }
  render();
}
function exHTML(ex){ return ex.replace(/\[(.+?)\]/,"<mark>$1</mark>"); }
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function render(popAt){
  out.innerHTML = "";
  if (!model.length){ out.innerHTML='<span class="unknown" style="font-family:var(--body);font-size:1.1rem">Translation</span>'; }
  model.forEach((m,mi)=>{
    if (m.type==="punct"){ if(m.text.trim()){const s=document.createElement("span");s.className="punct";s.textContent=m.text.trim()+" ";out.appendChild(s);} return; }
    if (m.type==="unknown"){ const s=document.createElement("span");s.className="word unknown";s.title="Not in the dictionary";s.textContent="["+m.text+"]";out.appendChild(s);return; }
    const w=document.createElement("span"); w.className="word";
    m.segs.forEach((g,gi)=>{
      const b=document.createElement("button"); b.className="seg"; b.textContent=g.sp;
      b.setAttribute("aria-label",`${g.sp}, the /${LIB[g.ph][0]}/ sound from ${g.ex.replace(/[\[\]]/g,"")}. Tap to re-roll.`);
      if (popAt && popAt[0]===mi && popAt[1]===gi) b.classList.add("pop");
      b.onclick=()=>{ m.segs[gi]=pick(g.ph,g.sp); render([mi,gi]); };
      w.appendChild(b);
    });
    out.appendChild(w);
  });
  // recipe
  recipe.innerHTML="";
  model.filter(m=>m.type!=="punct").forEach(m=>{
    const lab=document.createElement("div"); lab.className="wordlabel";
    lab.textContent = m.type==="unknown" ? `${m.text} · not in the dictionary yet` : `${m.text} → ${m.segs.map(s=>s.sp).join("")}`;
    recipe.appendChild(lab);
    if (m.type!=="word") return;
    const g=document.createElement("div"); g.className="recipe";
    m.segs.forEach(s=>{
      g.insertAdjacentHTML("beforeend",`<div class="step"><div class="sp">${esc(s.sp)}</div><div class="from"><div>as in ${exHTML(esc(s.ex))}</div><div class="ph">/${LIB[s.ph][0]}/ · ${LIB[s.ph][1]}</div></div></div>`);
    });
    recipe.appendChild(g);
  });
  $("count").textContent = `${src.value.length} / 500`;
}
function ghotiText(){ return model.map(m=>m.type==="word"?m.segs.map(s=>s.sp).join(""):m.text).join(""); }

let t; src.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>build(false),180);});
$("clear").onclick=()=>{src.value="";build(false);src.focus();};
$("shuffle").onclick=()=>build(false);
$("plain").onchange=()=>build(false);
function toast(msg){const e=$("toast");e.textContent=msg;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800);}
$("copy").onclick=()=>{
  const txt=ghotiText();
  navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press copy.");});
};
$("swap").onclick=()=>toast("Ghoti only translates one way. Nobody can read it back.");

build(true);
</script>
